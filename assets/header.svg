<svg fill="none" viewBox="0 0 1200 260" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c172a" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="name-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00D9FF" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#name-gradient);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 20px;
      fill: #00D9FF;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 500;
      font-size: 13px;
      fill: #94a3b8;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 0.8;
      stroke-opacity: 0.4;
    }
    .orbit-node {
      fill: #00D9FF;
      opacity: 0.8;
    }
  </style>

  <!-- Card Background with Rounded Borders -->
  <rect width="1200" height="260" rx="16" fill="url(#bg-gradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Elements -->
  <circle cx="1050" cy="50" r="140" fill="#00D9FF" opacity="0.12" filter="url(#glow-cyan)" />
  <circle cx="150" cy="220" r="160" fill="#818cf8" opacity="0.1" filter="url(#glow-purple)" />
  <circle cx="600" cy="30" r="100" fill="#0284c7" opacity="0.08" filter="url(#glow-cyan)" />

  <!-- Subtle Tech Grid Pattern in Background -->
  <g opacity="0.5">
    <line x1="80" y1="0" x2="80" y2="260" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="260" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="260" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="260" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="260" class="grid-line" />
    <line x1="880" y1="0" x2="880" y2="260" class="grid-line" />
    <line x1="1040" y1="0" x2="1040" y2="260" class="grid-line" />

    <line x1="0" y1="65" x2="1200" y2="65" class="grid-line" />
    <line x1="0" y1="130" x2="1200" y2="130" class="grid-line" />
    <line x1="0" y1="195" x2="1200" y2="195" class="grid-line" />
  </g>

  <!-- Cyber Wavy Energy Path -->
  <path d="M 0 195 Q 300 130, 600 195 T 1200 130" fill="none" stroke="url(#accent-cyan-purple)" stroke-width="2.5" opacity="0.35" />
  <path d="M 0 210 Q 300 160, 600 210 T 1200 160" fill="none" stroke="#00D9FF" stroke-width="1.2" opacity="0.2" stroke-dasharray="6,6" />

  <!-- Connected Nodes -->
  <circle cx="300" cy="162" r="3.5" class="orbit-node" />
  <circle cx="600" cy="195" r="4.5" class="orbit-node" />
  <circle cx="900" cy="162" r="3.5" class="orbit-node" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-cyan-purple)" rx="2" />

  <!-- Main Content Center Stack -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Header Title -->
    <text y="0" class="title">Mohd Goush</text>
    
    <!-- Subtitle Role -->
    <text y="38" class="subtitle">AI &amp; Agentic Systems Engineer  ·  MLOps &amp; Cloud Infra</text>
  </g>

  <!-- Tag Pills Grid at Bottom -->
  <g transform="translate(600, 185)" text-anchor="middle">
    <!-- Pill 1: Multi-Agent -->
    <g transform="translate(-375, 0)">
      <rect x="-105" y="-18" width="210" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-85" cy="-1" r="4" fill="#00D9FF" />
      <text x="-70" y="4" class="tag-text" text-anchor="start">Multi-Agent Systems</text>
    </g>

    <!-- Pill 2: Advanced RAG -->
    <g transform="translate(-130, 0)">
      <rect x="-95" y="-18" width="190" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-75" cy="-1" r="4" fill="#38bdf8" />
      <text x="-60" y="4" class="tag-text" text-anchor="start">Production RAG</text>
    </g>

    <!-- Pill 3: LeetCode Knight -->
    <g transform="translate(110, 0)">
      <rect x="-100" y="-18" width="200" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-80" cy="-1" r="4" fill="#fbbf24" />
      <text x="-65" y="4" class="tag-text" text-anchor="start">LeetCode Knight (1915)</text>
    </g>

    <!-- Pill 4: Cloud & AKS -->
    <g transform="translate(355, 0)">
      <rect x="-100" y="-18" width="200" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-80" cy="-1" r="4" fill="#818cf8" />
      <text x="-65" y="4" class="tag-text" text-anchor="start">Azure AKS &amp; MLOps</text>
    </g>
  </g>
</svg>
